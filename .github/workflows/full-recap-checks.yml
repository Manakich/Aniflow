name: Full Recap Studio checks

on:
  push:
    branches:
      - feat/full-recap-studio
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest requests Pillow
      - name: Compile Python modules
        run: python -m compileall -q app.py config.py pipeline
      - name: Run Full Recap unit tests
        run: python -m pytest tests/test_full_recap.py -q
      - name: Check JavaScript syntax
        run: node --check static/js/app.js
