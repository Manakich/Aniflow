<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga Recap — Secret Voicer</title>
  <style>
    body { width: 390px; margin: 0; padding: 14px; color: #202124; font: 13px/1.45 Arial, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 7px 0; }
    button { border: 0; border-radius: 7px; padding: 9px 12px; background: #222; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 20px; color: #444; }
    textarea { box-sizing: border-box; width: 100%; height: 210px; margin-top: 8px; padding: 8px; resize: vertical; font: 11px/1.4 Consolas, monospace; }
    .note { color: #666; font-size: 11px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    #run { background: #2457a6; }
  </style>
</head>
<body>
  <h1>Manga Recap — Secret Voicer</h1>
  <p>Запусти локальный Python-мост командой, которую мы используем в инструкции, затем нажми кнопку ниже.</p>
  <div class="actions">
    <button id="run">Запустить задание из Python</button>
    <button id="inspect">Проверить страницу</button>
    <button id="copy" disabled>Скопировать JSON</button>
  </div>
  <p id="status" role="status">Готов к работе.</p>
  <textarea id="report" readonly spellcheck="false" placeholder="Здесь появится диагностика интерфейса."></textarea>
  <p class="note">Расширение использует открытую сессию Secret Voicer. Пароли, cookies и коды Telegram не считываются и не передаются.</p>
  <script src="popup.js"></script>
</body>
</html>
